  - key: remote
    label: VIIRS + S5P
    graph_best_trial_json: optimization/runs/gsl_meanmax_consensus_viirs_s5p_y2020_nowcast_source_2020.json
    linear_best_trial_json: optimization/runs/linear_model__gsl_meanmax_consensus_viirs_s5p_y2020_nowcast_source_2020.json

  - key: full
    label: Admin + VIIRS + S5P
    graph_best_trial_json: optimization/runs/gsl_meanmax_consensus_admin_viirs_s5p_y2020_nowcast_source_2020.json
    linear_best_trial_json: optimization/runs/linear_model__gsl_meanmax_consensus_admin_viirs_s5p_y2020_nowcast_source_2020.json
